<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 2026 — Championship Standings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000;
    --panel:#0B0B0D;
    --line:#1C1C22;
    --line-2:#26262E;
    --ink:#FFFFFF;
    --muted:#7A7C85;
    --faint:#4B4D55;
    --red:#E10600;
    --up:#22C55E;
    --down:#EF4444;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  .wrap{max-width:1200px;margin:0 auto;padding:28px 28px 80px}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding-bottom:22px;border-bottom:1px solid var(--line);flex-wrap:wrap;
  }
  .brand{display:flex;align-items:baseline;gap:14px}
  .brand .f1{
    font-weight:900;font-style:italic;font-size:28px;letter-spacing:-1px;line-height:1;
  }
  .brand .f1 em{color:var(--red);font-style:italic}
  .brand .tag{color:var(--muted);font-size:12px;letter-spacing:2px;font-weight:600;text-transform:uppercase}
  .cluster{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--muted)}
  .livepill{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:2px;color:var(--ink);font-size:11px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--red);position:relative}
  .dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--red);animation:ping 1.6s ease-out infinite}
  .dot.off{background:var(--faint)}
  .dot.off::after{display:none}
  @keyframes ping{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.8);opacity:0}}
  .btn{
    background:transparent;color:var(--ink);border:1px solid var(--line-2);
    padding:8px 14px;border-radius:6px;font-size:11px;letter-spacing:1.5px;font-weight:700;
    text-transform:uppercase;cursor:pointer;transition:border-color .15s,color .15s;
    font-family:inherit;
  }
  .btn:hover{border-color:var(--red);color:var(--red)}
  .btn:focus-visible{outline:2px solid var(--red);outline-offset:2px}

  /* ---------- hero ---------- */
  .hero{padding:34px 0 22px;display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap}
  .hero h1{
    font-size:clamp(30px,4.6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;
  }
  .hero h1 span{color:var(--muted);font-weight:500}
  .meta{display:flex;gap:22px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase}
  .meta b{color:var(--ink);font-weight:700;margin-left:6px}

  .tabs{
    display:inline-flex;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:4px;margin-top:22px;
  }
  .tabs button{
    background:transparent;border:0;color:var(--muted);font-family:inherit;font-weight:700;
    font-size:12px;letter-spacing:1.5px;text-transform:uppercase;
    padding:9px 22px;border-radius:7px;cursor:pointer;transition:background .15s,color .15s;
  }
  .tabs button.active{background:#fff;color:#000}
  .tabs button:focus-visible{outline:2px solid var(--red);outline-offset:2px}

  /* ---------- podium ---------- */
  .podium{
    display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:22px;
    align-items:end;margin-top:28px;
  }
  .pcard{
    position:relative;border-radius:22px;overflow:hidden;
    padding:26px 24px 24px;min-height:260px;
    display:flex;flex-direction:column;justify-content:space-between;
    background:linear-gradient(135deg,var(--tc,#333) 0%,#0d0d10 78%);
    isolation:isolate;
  }
  .pcard.p1{min-height:300px}
  /* halftone dot texture — pure CSS, no assets */
  .pcard::before{
    content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.22) 1.2px, transparent 1.6px);
    background-size:14px 14px;background-position:0 0;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 15%,#000 65%,transparent 100%);
            mask-image:linear-gradient(90deg,transparent 0,#000 15%,#000 65%,transparent 100%);
    opacity:.35;
  }
  .pcard::after{
    content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(120% 90% at 100% 0%, rgba(0,0,0,.15), rgba(0,0,0,.55) 70%);
  }
  .pcard > *{position:relative;z-index:1}
  .pcard .rank{
    font-weight:800;font-size:13px;letter-spacing:2px;color:rgba(255,255,255,.9);text-transform:uppercase;
  }
  .pcard .who{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .pcard .name{
    font-weight:800;font-size:26px;letter-spacing:-.6px;color:#fff;line-height:1.05;
    text-shadow:0 2px 20px rgba(0,0,0,.35);
  }
  .pcard.p1 .name{font-size:30px}
  .pcard .team{
    font-size:13px;color:rgba(255,255,255,.78);font-weight:500;display:flex;align-items:center;gap:8px;
  }
  .pcard .team .flag{font-size:16px;line-height:1}
  .pcard .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:auto}
  .pcard .pts{
    font-weight:800;font-size:28px;letter-spacing:-.5px;color:#fff;
  }
  .pcard .pts small{font-size:12px;font-weight:700;letter-spacing:1.5px;margin-left:6px;opacity:.85}
  /* driver cutout on the right */
  .pcard .cutout{
    position:absolute;right:-6px;bottom:0;height:88%;width:60%;z-index:1;pointer-events:none;
    display:flex;align-items:flex-end;justify-content:flex-end;
  }
  .pcard.p1 .cutout{height:96%}
  .pcard .cutout img{
    max-height:100%;max-width:100%;object-fit:contain;object-position:right bottom;
    filter:drop-shadow(-8px 12px 24px rgba(0,0,0,.55));
  }
  .pcard .cutout .placeholder{
    width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08);
    border:2px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:34px;letter-spacing:1px;color:rgba(255,255,255,.6);margin-bottom:8px;margin-right:6px;
  }
  .pcard .ghost{
    position:absolute;left:16px;bottom:-24px;font-weight:900;font-style:italic;
    font-size:170px;line-height:1;color:rgba(255,255,255,.06);z-index:0;letter-spacing:-8px;
  }

  /* ---------- table ---------- */
  .tblwrap{margin-top:38px}
  .thead,.trow{
    display:grid;grid-template-columns:70px 2fr 1.4fr 1.4fr 100px;
    align-items:center;gap:20px;padding:0 22px;
  }
  .thead{
    color:var(--muted);font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;
    padding-top:14px;padding-bottom:14px;border-bottom:1px solid var(--line);
  }
  .thead .r{text-align:right}
  .trow{
    padding-top:16px;padding-bottom:16px;border-bottom:1px solid var(--line);
    transition:background .3s;position:relative;
  }
  .trow:hover{background:#0A0A0D}
  .trow .pos{font-size:18px;font-weight:700;color:var(--muted)}
  .trow.p1 .pos,.trow.p2 .pos,.trow.p3 .pos{color:var(--ink)}
  .drv{display:flex;align-items:center;gap:14px;min-width:0}
  .av{
    width:40px;height:40px;flex:0 0 40px;border-radius:50%;overflow:hidden;position:relative;
    background:#111;border:2px solid var(--tc,#333);
  }
  .av img{position:absolute;inset:0;width:100%;height: 270%;object-fit:cover;display:block}
  .av b{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;color:var(--tc,#888);letter-spacing:.5px;
  }
  .drv .nm{font-weight:600;font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .drv .code{color:var(--faint);font-weight:600;font-size:11px;margin-left:8px;letter-spacing:1px}
  .nat{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nat .flag{font-size:18px;line-height:1}
  .teamc{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .teamc .swatch{width:8px;height:8px;border-radius:50%;background:var(--tc,#555);flex:0 0 8px}
  .tlogo{
    width:26px;height:26px;flex:0 0 26px;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.04);border-radius:6px;padding:3px;
  }
  .tlogo img{max-width:100%;max-height:100%;object-fit:contain;display:block}
  .av.logoav{background:#fff;border-color:#fff}
  .av.logoav img{padding:5px;object-fit:contain}
  .pcard .cutout.logoout{
    width:52%;height:78%;align-items:center;justify-content:center;padding-right:20px;
  }
  .pcard .cutout.logoout img{
    max-height:78%;max-width:78%;object-fit:contain;
    filter:drop-shadow(0 6px 22px rgba(0,0,0,.55));
  }
  .pcard.p1 .cutout.logoout{height:82%}
  .trow .pts{text-align:right;font-weight:700;font-size:17px}
  .delta{
    position:absolute;left:44px;top:50%;transform:translateY(-50%);
    font-size:10px;font-weight:700;letter-spacing:.5px;
  }
  .delta.up{color:var(--up)}
  .delta.down{color:var(--down)}
  .trow .pos{position:relative}

  @keyframes flashup{0%{background:rgba(34,197,94,.10)}100%{background:transparent}}
  @keyframes flashdown{0%{background:rgba(239,68,68,.10)}100%{background:transparent}}
  .trow.flash-up{animation:flashup 2.4s ease-out}
  .trow.flash-down{animation:flashdown 2.4s ease-out}

  .banner{
    display:none;margin-top:24px;padding:12px 18px;border:1px solid rgba(225,6,0,.4);
    background:rgba(225,6,0,.08);border-radius:8px;font-size:12px;color:#FFB3B0;
  }
  .banner.show{display:block}

  /* ---------- constructor view ---------- */
  .thead.ctor,.trow.ctor{grid-template-columns:70px 2fr 1.4fr 100px 100px}

  .foot{
    margin-top:36px;padding-top:18px;border-top:1px solid var(--line);
    font-size:11px;color:var(--faint);letter-spacing:1px;
    display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;text-transform:uppercase;
  }
  .foot a{color:var(--muted);text-decoration:none}
  .foot a:hover{color:var(--red)}

  @media (max-width:900px){
    .podium{grid-template-columns:1fr;gap:16px}
    .pcard,.pcard.p1{min-height:180px}
    .pcard .cutout{width:45%;height:92%}
    .thead{display:none}
    .thead,.trow{grid-template-columns:44px 1.5fr auto 80px;gap:12px;padding:0 14px}
    .nat{display:none}
    .thead.ctor,.trow.ctor{grid-template-columns:44px 1.5fr 60px 80px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="f1">F<em>1</em></div>
      <div class="tag" id="seasonChip">2026 Season</div>
    </div>
    <div class="cluster">
      <div class="livepill"><span class="dot" id="liveDot"></span>LIVE</div>
      <div id="clock">—</div>
      <button class="btn" id="refreshBtn" type="button">↻ Refresh</button>
    </div>
  </div>

  <div class="hero">
    <div>
      <h1 id="headline">Championship <span>Standings</span></h1>
      <div class="meta" style="margin-top:14px">
        <div>Season<b id="mSeason">2026</b></div>
        <div>Round<b id="mRound">—</b></div>
        <div>Updated<b id="mUpdated">—</b></div>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button id="tabDrivers" class="active" type="button">Drivers</button>
      <button id="tabCtors" type="button">Constructors</button>
    </div>
  </div>

  <div class="banner" id="banner">Live feed unreachable — showing last known standings. Retrying automatically.</div>

  <div class="podium" id="podium"></div>
  <div class="tblwrap"><div id="table"></div></div>

  <div class="foot">
    <div>Data · <a href="https://api.jolpi.ca/ergast/f1/current/driverstandings/" target="_blank" rel="noopener">Jolpica F1 API</a> · polls every 60s · headshots from local Stands/&lt;CODE&gt;.avif</div>
    <div>Position changes vs. your last visit are flagged ▲▼</div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ============ team identity ============ */
  var TEAM = {
    mercedes:{color:"#27F4D2", short:"Mercedes", file:"mercedes.png"},
    ferrari:{color:"#E80020", short:"Ferrari", file:"ferrari.png"},
    mclaren:{color:"#FF8000", short:"McLaren", file:"mclaren.png"},
    red_bull:{color:"#3671C6", short:"Red Bull", file:"redbull.png"},
    rb:{color:"#6692FF", short:"Racing Bulls", file:"racingbulls.png"},
    alpine:{color:"#0093CC", short:"Alpine", file:"alpine.png"},
    haas:{color:"#B6BABD", short:"Haas", file:"haas.png"},
    audi:{color:"#F50537", short:"Audi", file:"audi.png"},
    williams:{color:"#64C4FF", short:"Williams", file:"williams.png"},
    aston_martin:{color:"#229971", short:"Aston Martin", file:"astonmartin.png"},
    cadillac:{color:"#C8B06A", short:"Cadillac", file:"cadillac.png"}
  };
  function team(id){ return TEAM[id] || {color:"#5A626D", short:id, file:null}; }

  /* ============ backend API ============
     Standings come from the Flask backend deployed on Render, which proxies
     the championship feed. Override at runtime with window.API_BASE if needed. */
  var API_BASE = (typeof window !== "undefined" && window.API_BASE) ||
                 "https://f1-dashboard-and-analysis.onrender.com";
  var CHAMPIONSHIP_URL = API_BASE.replace(/\/+$/, "") + "/api/championship";

  /* Map backend teamName -> local TEAM key (for colours, logos, short names). */
  var TEAM_BY_NAME = {
    "mercedes":"mercedes", "ferrari":"ferrari", "mclaren":"mclaren",
    "red bull racing":"red_bull", "red bull":"red_bull",
    "racing bulls":"rb", "rb f1 team":"rb", "rb":"rb", "visa cash app rb":"rb",
    "alpine":"alpine", "alpine f1 team":"alpine", "bwt alpine f1 team":"alpine",
    "haas":"haas", "haas f1 team":"haas", "moneygram haas f1 team":"haas",
    "audi":"audi", "sauber":"audi", "kick sauber":"audi", "stake f1 team kick sauber":"audi",
    "williams":"williams",
    "aston martin":"aston_martin", "aston martin aramco":"aston_martin",
    "cadillac":"cadillac"
  };
  function teamKey(name){
    if(!name) return "";
    return TEAM_BY_NAME[String(name).trim().toLowerCase()] || "";
  }

  /* Map backend nationality (3-letter code) -> adjective used by NAT. */
  var NAT_BY_CODE = {
    ITA:"Italian", GBR:"British", GER:"German", DEU:"German", MON:"Monégasque",
    NED:"Dutch", NLD:"Dutch", AUS:"Australian", FRA:"French", NZL:"New Zealander",
    ARG:"Argentine", BRA:"Brazilian", ESP:"Spanish", THA:"Thai", JPN:"Japanese",
    CAN:"Canadian", MEX:"Mexican", FIN:"Finnish", USA:"American"
  };
  function natName(x){ return NAT_BY_CODE[String(x || "").toUpperCase()] || x; }

  /* ============ nationality → { flag emoji, country label } ============ */
  var NAT = {
    "Italian":       ["🇮🇹","Italy"],
    "British":       ["🇬🇧","United Kingdom"],
    "German":        ["🇩🇪","Germany"],
    "Monégasque":    ["🇲🇨","Monaco"],
    "Monegasque":    ["🇲🇨","Monaco"],
    "Dutch":         ["🇳🇱","Netherlands"],
    "Australian":    ["🇦🇺","Australia"],
    "French":        ["🇫🇷","France"],
    "New Zealander": ["🇳🇿","New Zealand"],
    "Argentine":     ["🇦🇷","Argentina"],
    "Argentinian":   ["🇦🇷","Argentina"],
    "Brazilian":     ["🇧🇷","Brazil"],
    "Spanish":       ["🇪🇸","Spain"],
    "Thai":          ["🇹🇭","Thailand"],
    "Japanese":      ["🇯🇵","Japan"],
    "Canadian":      ["🇨🇦","Canada"],
    "Mexican":       ["🇲🇽","Mexico"],
    "Finnish":       ["🇫🇮","Finland"],
    "American":      ["🇺🇸","United States"]
  };
  function nat(x){ return NAT[x] || ["🏳️", x || "—"]; }

  /* ============ fallback snapshot (2026, R14) — includes nationality ============ */
  var FALLBACK = {
    season:"2026", round:"14",
    drivers:[
      ["1","ANT","Andrea Kimi Antonelli","12","Mercedes","mercedes","Italian",8,292],
      ["2","RUS","George Russell","63","Mercedes","mercedes","British",2,211],
      ["3","HAM","Lewis Hamilton","44","Ferrari","ferrari","British",1,191],
      ["4","NOR","Lando Norris","1","McLaren","mclaren","British",2,186],
      ["5","LEC","Charles Leclerc","16","Ferrari","ferrari","Monégasque",1,167],
      ["6","VER","Max Verstappen","3","Red Bull","red_bull","Dutch",0,145],
      ["7","PIA","Oscar Piastri","81","McLaren","mclaren","Australian",0,120],
      ["8","HAD","Isack Hadjar","6","Red Bull","red_bull","French",0,71],
      ["9","LAW","Liam Lawson","30","RB F1 Team","rb","New Zealander",0,59],
      ["10","GAS","Pierre Gasly","10","Alpine F1 Team","alpine","French",0,41],
      ["11","LIN","Arvid Lindblad","41","RB F1 Team","rb","British",0,31],
      ["12","COL","Franco Colapinto","43","Alpine F1 Team","alpine","Argentine",0,27],
      ["13","BEA","Oliver Bearman","87","Haas F1 Team","haas","British",0,18],
      ["14","BOR","Gabriel Bortoleto","5","Audi","audi","Brazilian",0,10],
      ["15","HUL","Nico Hülkenberg","27","Audi","audi","German",0,7],
      ["16","SAI","Carlos Sainz","55","Williams","williams","Spanish",0,6],
      ["17","ALB","Alexander Albon","23","Williams","williams","Thai",0,5],
      ["18","OCO","Esteban Ocon","31","Haas F1 Team","haas","French",0,3],
      ["19","ALO","Fernando Alonso","14","Aston Martin","aston_martin","Spanish",0,3],
      ["20","TSU","Yuki Tsunoda","22","RB F1 Team","rb","Japanese",0,1],
      ["21","STR","Lance Stroll","18","Aston Martin","aston_martin","Canadian",0,0],
      ["22","BOT","Valtteri Bottas","77","Cadillac F1 Team","cadillac","Finnish",0,0],
      ["23","PER","Sergio Pérez","11","Cadillac F1 Team","cadillac","Mexican",0,0]
    ],
    ctors:[
      ["1","Mercedes","mercedes","German",10,503],
      ["2","Ferrari","ferrari","Italian",2,358],
      ["3","McLaren","mclaren","British",2,306],
      ["4","Red Bull","red_bull","Austrian",0,230],
      ["5","RB F1 Team","rb","Italian",0,77],
      ["6","Alpine F1 Team","alpine","French",0,68],
      ["7","Haas F1 Team","haas","American",0,21],
      ["8","Audi","audi","German",0,17],
      ["9","Williams","williams","British",0,11],
      ["10","Aston Martin","aston_martin","British",0,3],
      ["11","Cadillac F1 Team","cadillac","American",0,0]
    ]
  };

  /* ============ state ============ */
  var view = "drivers";
  var POLL_MS = 60000;
  var timer = null, countdownTimer = null, nextAt = 0, lastFetchAt = 0;
  var currentRows = null;

  var $ = function(id){ return document.getElementById(id); };

  /* ============ image path discovery ============
     imgBase  → resolves to the Stands/ folder for driver headshots
     logoBase → resolves to the logos/ folder for team logos
     Probes several candidate roots so it survives whatever folder VS Code
     Live Server is opened from. On the embedded preview (no file access)
     both stay null and the monogram fallbacks show through. */
  function probe(paths, testFile){
    if(location.protocol === "file:") return Promise.resolve(paths[0]);
    if(location.protocol.indexOf("http") !== 0) return Promise.resolve(null);
    return paths.reduce(function(p,b){
      return p.then(function(found){
        if(found) return found;
        return new Promise(function(res){
          var im = new Image();
          im.onload = function(){ res(b); };
          im.onerror = function(){ res(null); };
          im.src = b + testFile;
        });
      });
    }, Promise.resolve(null));
  }
  var imgBase = null, logoBase = null;
  var pendingImg  = probe(["Stands/","./","../Stands/"], "ANT.avif");
  var pendingLogo = probe(["logos/","./","../logos/"], "mercedes.png");
  pendingImg.then(function(b){  imgBase = b;  });
  pendingLogo.then(function(b){ logoBase = b; });

  /* ============ normalize (backend shape) ============
     Backend returns: { season, drivers:[...], constructors:[...] } where each
     driver has { position, driverId, firstName, lastName, teamName,
     nationality, wins, points } and each constructor has
     { position, teamName, nationality, wins, points }. */
  function normalizeDrivers(list){
    return (list || []).map(function(r){
      var tid = teamKey(r.teamName);
      return {
        pos:+r.position,
        id:String(r.driverId || "").toUpperCase(),
        name:[r.firstName, r.lastName].filter(Boolean).join(" "),
        num:r.driverNumber,
        teamId:tid || r.teamName,
        teamName:r.teamName,
        nationality:natName(r.nationality),
        wins:+r.wins || 0,
        pts:+r.points || 0
      };
    });
  }
  function normalizeCtors(list){
    return (list || []).map(function(r){
      var tid = teamKey(r.teamName || r.name);
      return {
        pos:+r.position,
        id:tid || r.teamName || r.name,
        name:r.teamName || r.name,
        teamId:tid || r.teamName || r.name,
        nationality:natName(r.nationality),
        wins:+r.wins || 0,
        pts:+r.points || 0
      };
    });
  }
  function fallbackRows(){
    return view === "drivers"
      ? FALLBACK.drivers.map(function(a){ return {pos:+a[0],id:a[1],name:a[2],num:a[3],teamId:a[5],teamName:a[4],nationality:a[6],wins:+a[7],pts:+a[8]}; })
      : FALLBACK.ctors.map(function(a){ return {pos:+a[0],id:a[2],name:a[1],teamId:a[2],nationality:a[3],wins:+a[4],pts:+a[5]}; });
  }

  function fetchLive(){
    return fetch(CHAMPIONSHIP_URL, {headers:{"Accept":"application/json"}})
      .then(function(res){ if(!res.ok) throw new Error("HTTP "+res.status); return res.json(); })
      .then(function(j){
        if(j.season){
          $("mSeason").textContent = j.season;
          $("seasonChip").textContent = j.season + " Season";
        }
        if(j.round != null){ $("mRound").textContent = j.round; }
        return view === "drivers"
          ? normalizeDrivers(j.drivers)
          : normalizeCtors(j.constructors);
      });
  }

  /* ============ change detection ============ */
  function readPrev(){ try { return JSON.parse(localStorage.getItem("f1_"+view)) || null; } catch(e){ return null; } }
  function writePrev(rows){
    try { localStorage.setItem("f1_"+view, JSON.stringify(rows.map(function(r){ return {id:r.id,pos:r.pos,pts:r.pts}; }))); } catch(e){}
  }
  function deltas(rows){
    var ref = currentRows;
    if(!ref){ var st = readPrev(); if(st) ref = st.map(function(s){ return {id:s.id, pos:s.pos}; }); }
    var m = {}; (ref||[]).forEach(function(r){ m[r.id] = r.pos; });
    return rows.map(function(r){
      var d = 0, known = m[r.id] != null;
      if(known) d = m[r.id] - r.pos;
      return {row:r, delta:d, known:known};
    });
  }

  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  /* ============ render podium ============ */
  function ordinal(n){ return n===1?"1st":n===2?"2nd":n===3?"3rd":n+"th"; }

  function podiumCard(row, place){
    var t = team(row.teamId), n = nat(row.nationality);
    var isDrv = view === "drivers";
    var cutout = "";
    if(isDrv){
      cutout = imgBase
        ? '<div class="cutout"><img src="'+imgBase+esc(row.id)+'.avif" alt="" onerror="this.parentNode.innerHTML=\'<div class=&quot;placeholder&quot;>'+esc(row.id)+'</div>\';"></div>'
        : '<div class="cutout"><div class="placeholder">'+esc(row.id)+'</div></div>';
    } else {
      cutout = logoBase && t.file
        ? '<div class="cutout logoout"><img src="'+logoBase+esc(t.file)+'" alt="" onerror="this.parentNode.innerHTML=\'<div class=&quot;placeholder&quot;>'+esc(t.short.substring(0,3).toUpperCase())+'</div>\';"></div>'
        : '<div class="cutout"><div class="placeholder">'+esc(t.short.substring(0,3).toUpperCase())+'</div></div>';
    }
    var subline = isDrv
      ? '<div class="team"><span class="flag">'+n[0]+'</span> '+esc(t.short)+'</div>'
      : '<div class="team"><span class="flag">'+n[0]+'</span> '+esc(n[1])+'</div>';
    return ''+
      '<div class="pcard p'+place+'" style="--tc:'+t.color+'">'+
        '<div class="ghost">'+place+'</div>'+
        '<div class="rank">'+ordinal(place).toUpperCase()+'</div>'+
        '<div class="who">'+
          '<div class="name">'+esc(row.name)+'</div>'+
          subline+
        '</div>'+
        cutout+
        '<div class="foot"><div class="pts">'+row.pts+'<small>PTS</small></div></div>'+
      '</div>';
  }

  function renderPodium(rows){
    var top3 = rows.slice(0,3);
    if(top3.length < 3){ $("podium").innerHTML = ""; return; }
    /* order: 2nd | 1st | 3rd */
    $("podium").innerHTML = podiumCard(top3[1], 2) + podiumCard(top3[0], 1) + podiumCard(top3[2], 3);
  }

  /* ============ render table (row 1..N) ============ */
  function avatarSm(code, color){
    var img = view === "drivers" && imgBase
      ? '<img src="'+imgBase+esc(code)+'.avif" alt="" loading="lazy" onerror="this.remove()">'
      : '';
    return '<span class="av" style="--tc:'+color+'"><b>'+esc(code)+'</b>'+img+'</span>';
  }

  function renderTable(rows){
    var items = deltas(rows);
    var isDrv = view === "drivers";
    var head = isDrv
      ? '<div class="thead"><span>Pos.</span><span>Driver</span><span>Nationality</span><span>Team</span><span class="r">Pts.</span></div>'
      : '<div class="thead ctor"><span>Pos.</span><span>Constructor</span><span>Nationality</span><span class="r">Wins</span><span class="r">Pts.</span></div>';

    var body = items.map(function(it){
      var r = it.row, t = team(r.teamId), n = nat(r.nationality);
      var flash = it.known && it.delta > 0 ? " flash-up"
                : it.known && it.delta < 0 ? " flash-down" : "";
      var dbadge = it.known && it.delta !== 0
        ? '<span class="delta '+(it.delta>0?"up":"down")+'">'+(it.delta>0?"▲"+it.delta:"▼"+Math.abs(it.delta))+'</span>'
        : '';
      var cls = "trow"+(isDrv?"":" ctor")+(r.pos<=3?" p"+r.pos:"")+flash;
      var teamMark = logoBase && t.file
        ? '<span class="tlogo"><img src="'+logoBase+esc(t.file)+'" alt="" loading="lazy" onerror="this.parentNode.innerHTML=\'<span class=&quot;swatch&quot; style=&quot;--tc:'+t.color+'&quot;></span>\';"></span>'
        : '<span class="swatch" style="--tc:'+t.color+'"></span>';
      if(isDrv){
        return '<div class="'+cls+'">'+
          '<span class="pos">'+r.pos+dbadge+'</span>'+
          '<div class="drv">'+avatarSm(r.id, t.color)+'<span class="nm">'+esc(r.name)+'<span class="code">'+esc(r.id)+'</span></span></div>'+
          '<div class="nat"><span class="flag">'+n[0]+'</span><span>'+esc(n[1])+'</span></div>'+
          '<div class="teamc">'+teamMark+'<span>'+esc(t.short)+'</span></div>'+
          '<span class="pts">'+r.pts+'</span>'+
        '</div>';
      } else {
        var ctorAv = logoBase && t.file
          ? '<span class="av logoav" style="--tc:'+t.color+'"><img src="'+logoBase+esc(t.file)+'" alt="" onerror="this.parentNode.innerHTML=\'<b>'+esc(t.short.substring(0,3).toUpperCase())+'</b>\';"></span>'
          : '<span class="av" style="--tc:'+t.color+'"><b>'+esc(t.short.substring(0,3).toUpperCase())+'</b></span>';
        return '<div class="'+cls+'">'+
          '<span class="pos">'+r.pos+dbadge+'</span>'+
          '<div class="drv">'+ctorAv+'<span class="nm">'+esc(r.name)+'</span></div>'+
          '<div class="nat"><span class="flag">'+n[0]+'</span><span>'+esc(n[1])+'</span></div>'+
          '<span class="pts" style="text-align:right">'+r.wins+'</span>'+
          '<span class="pts">'+r.pts+'</span>'+
        '</div>';
      }
    }).join("");
    $("table").innerHTML = head + body;
  }

  function render(rows, persist){
    renderPodium(rows);
    renderTable(rows);
    if(persist !== false){ writePrev(rows); currentRows = rows; }
  }

  /* ============ polling ============ */
  function fmtAgo(ts){
    var s = Math.max(0, Math.round((Date.now()-ts)/1000));
    if(s<60) return s+"s ago";
    var m = Math.floor(s/60); if(m<60) return m+"m ago";
    return Math.floor(m/60)+"h ago";
  }
  function tickClock(){
    if(lastFetchAt) $("mUpdated").textContent = fmtAgo(lastFetchAt);
    var left = Math.max(0, Math.round((nextAt-Date.now())/1000));
    $("clock").textContent = "Next poll "+left+"s";
  }
  function schedule(){ clearTimeout(timer); nextAt = Date.now()+POLL_MS; timer = setTimeout(cycle, POLL_MS); }
  function cycle(){
    fetchLive().then(function(rows){
      lastFetchAt = Date.now();
      $("banner").classList.remove("show"); $("liveDot").classList.remove("off");
      render(rows, true);
    }).catch(function(){
      $("banner").classList.add("show"); $("liveDot").classList.add("off");
      if(!currentRows) render(fallbackRows(), false);
    }).finally(schedule);
  }

  /* ============ view switch ============ */
  function setView(v){
    if(v === view) return;
    view = v; currentRows = null;
    $("tabDrivers").classList.toggle("active", v==="drivers");
    $("tabCtors").classList.toggle("active", v==="ctors");
    cycle();
  }
  $("tabDrivers").addEventListener("click", function(){ setView("drivers"); });
  $("tabCtors").addEventListener("click", function(){ setView("ctors"); });
  $("refreshBtn").addEventListener("click", cycle);

  /* ============ boot ============ */
  countdownTimer = setInterval(tickClock, 1000);
  render(fallbackRows(), false);
  cycle();
  /* repaint once either image root resolves, so photos / logos slot in */
  Promise.all([pendingImg, pendingLogo]).then(function(){
    if(currentRows) render(currentRows, false);
  });
})();
</script>
</body>
</html>
