<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Precision — Formula 1 2026</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box}

:root{
  --red:#E8002D;
  --white:#fff;
  --muted:rgba(255,255,255,.56);
  --line:rgba(255,255,255,.12);
  --mono:'JetBrains Mono',monospace;
  --display:'Barlow Condensed',sans-serif;
}

html{scroll-behavior:smooth}

body{
  background:#050507;
  color:var(--white);
  font-family:var(--mono);
  overflow-x:hidden;
}

/* ───────────── NAVIGATION ───────────── */

.navbar{
  position:fixed;
  top:18px;
  left:0;
  right:0;
  z-index:20;
  display:flex;
  justify-content:center;
  pointer-events:none;
}

.gantry{
  pointer-events:auto;
  display:flex;
  align-items:flex-start;
  padding:9px 14px 0;
  border:1px solid rgba(255,255,255,.09);
  border-radius:7px;
  background:rgba(7,7,9,.58);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:0 18px 50px rgba(0,0,0,.35);
}

.lpod{
  position:relative;
  width:82px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-decoration:none;
  color:#fff;
  cursor:pointer;
}

.lpod + .lpod::before{
  content:"";
  position:absolute;
  left:0;
  top:5px;
  bottom:15px;
  width:1px;
  background:rgba(255,255,255,.08);
}

.lpole{
  width:2px;
  height:13px;
  margin-bottom:5px;
  background:rgba(255,255,255,.22);
}

.lbulb{
  width:38px;
  height:38px;
  border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#250006,#090002 70%);
  border:1px solid rgba(180,0,30,.48);
  box-shadow:inset 0 0 10px #000;
  transition:.25s ease;
}

.lpod:hover .lbulb,
.lbulb.lit{
  background:radial-gradient(circle at 38% 34%,#ff3b5b,#d60027 52%,#64000e);
  border-color:#ff526b;
  box-shadow:
    0 0 15px rgba(232,0,45,.8),
    0 0 35px rgba(232,0,45,.28),
    inset 0 0 10px rgba(255,120,140,.35);
}

.llabel{
  margin:7px 0 8px;
  font-size:9px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:transparent;
  transition:.2s ease;
}

.lpod:hover .llabel,
.lpod.active .llabel{color:var(--red)}

.mob-toggle{display:none}
.mob-nav{display:none}

/* ───────────── HERO ───────────── */

.hero{
  position:relative;
  min-height:100vh;
  height:100vh;
  overflow:hidden;
  display:flex;
  align-items:center;
}

.hero-bg{
  position:absolute;
  inset:0;
  z-index:0;
  background-image:url("./background.png");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  transform:scale(1.025);
  animation:slowZoom 24s ease-in-out infinite alternate;
}

@keyframes slowZoom{
  from{transform:scale(1.025)}
  to{transform:scale(1.06)}
}

/* Keep the photograph visible everywhere while creating darker text space on the right. */
.hero-bg::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,
      rgba(3,3,5,.48) 0%,
      rgba(3,3,5,.20) 43%,
      rgba(3,3,5,.34) 67%,
      rgba(3,3,5,.72) 100%
    ),
    linear-gradient(180deg,
      rgba(0,0,0,.40) 0%,
      transparent 30%,
      rgba(0,0,0,.62) 100%
    );
}

.hero-bg::before{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(
    ellipse 600px 430px at 86% 65%,
    rgba(232,0,45,.22),
    transparent 70%
  );
  animation:redGlow 6s ease-in-out infinite alternate;
}

@keyframes redGlow{
  from{opacity:.55}
  to{opacity:1}
}

.hero-content{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  padding:90px clamp(28px,5vw,76px) 34px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

/* hero headline */

.hero-type{
  width:min(620px,48vw);
  margin-left:auto;
  text-align:right;
  transform:translateY(14%);
}

.hero h1{
  font-family:var(--display);
  font-size:clamp(54px,6.2vw,96px);
  line-height:.84;
  letter-spacing:-2px;
  font-weight:900;
  text-transform:uppercase;
  text-shadow:0 6px 35px rgba(0,0,0,.72);
}

.hero h1 .row{
  display:block;
}

.dynamic{
  color:var(--red);
}

.dynamic::after{
  content:"|";
  margin-left:5px;
  color:var(--red);
  font-weight:400;
  animation:caret .8s step-end infinite;
}

@keyframes caret{
  0%,100%{opacity:1}
  50%{opacity:0}
}

/* bottom */

.hero-bottom{
  display:flex;
  justify-content:center;
}

.next-link{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:9px;
  color:var(--muted);
  text-decoration:none;
  font-size:9px;
  letter-spacing:4px;
  text-transform:uppercase;
}

.next-line{
  width:1px;
  height:30px;
  background:linear-gradient(var(--red),transparent);
}

/* ───────────── NEXT RACE ───────────── */

.race-section{
  position:relative;
  padding:76px clamp(28px,5vw,76px) 70px;
  background:#070709;
  border-top:1px solid var(--line);
}

.race-inner{
  max-width:1180px;
  margin:auto;
}

.race-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:30px;
  padding-bottom:24px;
  border-bottom:1px solid var(--line);
}

.eyebrow{
  color:var(--red);
  font-size:10px;
  letter-spacing:4px;
  text-transform:uppercase;
  margin-bottom:9px;
}

.race-title{
  font-family:var(--display);
  font-size:clamp(48px,6vw,78px);
  line-height:.85;
  font-weight:900;
  text-transform:uppercase;
}

.race-title span{color:var(--red)}

.race-sub{
  margin-top:12px;
  color:var(--muted);
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
}

.race-sub em{
  font-style:normal;
  color:var(--red);
}

.race-meta{
  text-align:right;
  color:var(--muted);
  font-size:10px;
  line-height:1.9;
  letter-spacing:2px;
  text-transform:uppercase;
}

.race-meta b{color:#fff}

/* countdown + timezone switch */

.race-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:22px;
  flex-wrap:wrap;
  margin-top:26px;
}

.cd{
  display:flex;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
}

.cd-label{
  font-size:9px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--muted);
}

.cd-label b{color:#fff}

.cd-clock{display:flex;gap:9px}

.cd-unit{
  min-width:56px;
  padding:9px 8px;
  border:1px solid var(--line);
  border-radius:5px;
  background:rgba(255,255,255,.022);
  text-align:center;
}

.cd-unit b{
  display:block;
  font-family:var(--display);
  font-size:27px;
  font-weight:800;
  line-height:1;
  font-variant-numeric:tabular-nums;
}

.cd-unit span{
  display:block;
  margin-top:5px;
  font-size:8px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--muted);
}

.cd.hot .cd-unit b{color:var(--red)}

.cd-note{
  font-family:var(--display);
  font-size:24px;
  font-weight:800;
  text-transform:uppercase;
  color:var(--red);
}

.tzswitch{
  display:flex;
  border:1px solid var(--line);
  border-radius:5px;
  overflow:hidden;
}

.tzswitch button{
  padding:10px 13px;
  border:0;
  background:transparent;
  color:var(--muted);
  font:9px/1 var(--mono);
  letter-spacing:2px;
  text-transform:uppercase;
  cursor:pointer;
  transition:.2s ease;
}

.tzswitch button + button{border-left:1px solid var(--line)}
.tzswitch button:hover{color:#fff}
.tzswitch button.on{background:rgba(232,0,45,.14);color:#fff}

/* timetable */

.timetable{
  margin-top:26px;
}

.tt-row{
  display:grid;
  grid-template-columns:100px 80px 1fr 100px;
  align-items:center;
  gap:20px;
  padding:16px 18px;
  border-bottom:1px solid rgba(255,255,255,.07);
  border-left:2px solid transparent;
  transition:.2s ease;
}

.tt-row:hover{
  background:rgba(255,255,255,.025);
}

.tt-row.on{
  border-left-color:var(--red);
  background:linear-gradient(90deg,rgba(232,0,45,.10),transparent);
}

.tt-row.live{
  border-left-color:var(--red);
  background:linear-gradient(90deg,rgba(232,0,45,.18),transparent);
}

.tt-row.past{opacity:.34}

/* the grand prix itself always carries a little extra weight */
.tt-row.race{border-left-color:rgba(232,0,45,.45)}
.tt-row.race .time{color:var(--red)}
.tt-row.race .name{font-size:22px}

.day{
  font-family:var(--display);
  font-size:22px;
  font-weight:800;
  text-transform:uppercase;
}

.day small{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font:9px var(--mono);
  letter-spacing:2px;
}

.code{
  color:var(--muted);
  font-size:10px;
  letter-spacing:2px;
}

.name{
  font-family:var(--display);
  font-size:20px;
  font-weight:700;
  text-transform:uppercase;
}

.time{
  text-align:right;
  font-family:var(--display);
  font-size:24px;
  font-weight:800;
  font-variant-numeric:tabular-nums;
}

.tt-row.on .time,
.tt-row.live .time{color:var(--red)}

.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  margin-left:10px;
  padding:3px 6px;
  border:1px solid rgba(232,0,45,.5);
  border-radius:3px;
  font:8px/1 var(--mono);
  letter-spacing:2px;
  color:var(--red);
  vertical-align:middle;
}

.badge i{
  width:5px;
  height:5px;
  border-radius:50%;
  background:var(--red);
  animation:pulse 1.1s ease-in-out infinite;
}

@keyframes pulse{
  50%{opacity:.2}
}

/* season rail */

.cal{
  margin-top:40px;
  padding-top:22px;
  border-top:1px solid var(--line);
}

.cal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  margin-bottom:15px;
  font-size:9px;
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--muted);
}

.cal-reset{
  border:1px solid var(--line);
  border-radius:4px;
  background:transparent;
  color:var(--red);
  padding:8px 11px;
  font:9px var(--mono);
  letter-spacing:2px;
  text-transform:uppercase;
  cursor:pointer;
  transition:.2s ease;
}

.cal-reset:hover{border-color:rgba(232,0,45,.55)}
.cal-reset[hidden]{display:none}

.cal-rail{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:12px;
}

.cal-rail::-webkit-scrollbar{height:4px}
.cal-rail::-webkit-scrollbar-thumb{background:rgba(232,0,45,.4)}

.chip{
  flex:0 0 auto;
  min-width:92px;
  padding:11px 10px;
  border:1px solid var(--line);
  border-radius:6px;
  background:rgba(255,255,255,.022);
  color:#fff;
  text-align:left;
  font-family:var(--mono);
  cursor:pointer;
  transition:.2s ease;
}

.chip:hover{border-color:rgba(232,0,45,.5)}

.chip .r{display:block;font-size:8px;letter-spacing:2px;color:var(--muted)}

.chip .c{
  display:block;
  font-family:var(--display);
  font-size:20px;
  font-weight:800;
  margin:4px 0 3px;
  letter-spacing:.5px;
}

.chip .d{display:block;font-size:8px;letter-spacing:1px;color:var(--muted)}

.chip.done{opacity:.38}

.chip.next{
  border-color:var(--red);
  background:linear-gradient(180deg,rgba(232,0,45,.16),rgba(232,0,45,.02));
}

.chip.next .c{color:var(--red)}

.chip.viewing{box-shadow:0 0 0 1px rgba(255,255,255,.4)}

.chip .s{
  display:inline-block;
  margin-top:5px;
  font-size:7px;
  letter-spacing:1.5px;
  color:var(--red);
}

/* ───────────── MOBILE ───────────── */

@media(max-width:760px){
  .gantry{display:none}

  .navbar{
    justify-content:flex-end;
    padding:14px;
  }

  .mob-toggle{
    display:flex;
    flex-direction:column;
    gap:5px;
    padding:10px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:5px;
    background:rgba(5,5,7,.65);
    backdrop-filter:blur(12px);
  }

  .mob-toggle span{
    width:22px;
    height:2px;
    background:#fff;
  }

  .mob-nav{
    display:block;
    position:fixed;
    top:0;
    right:0;
    width:min(280px,82vw);
    height:100vh;
    z-index:19;
    padding:90px 28px 30px;
    background:rgba(5,5,7,.96);
    transform:translateX(100%);
    transition:.3s ease;
    border-left:1px solid rgba(232,0,45,.2);
  }

  .mob-nav.open{transform:translateX(0)}

  .mob-nav a{
    display:block;
    padding:16px 0;
    border-bottom:1px solid rgba(255,255,255,.08);
    color:#fff;
    text-decoration:none;
    font-family:var(--display);
    font-size:22px;
    font-weight:800;
    text-transform:uppercase;
  }

  .hero{
    min-height:760px;
    height:100svh;
  }

  .hero-bg{
    background-position:43% center;
  }

  .hero-content{
    padding:78px 22px 25px;
  }

  .hero-type{
    width:100%;
    margin-top:auto;
    margin-bottom:auto;
    padding-top:100px;
  }

  .hero h1{
    font-size:clamp(48px,14vw,76px);
    letter-spacing:-1px;
  }

  .race-section{
    padding:55px 22px;
  }

  .race-head{
    display:block;
  }

  .race-meta{
    margin-top:18px;
    text-align:left;
  }

  .race-bar{
    gap:16px;
  }

  .cd{gap:12px;width:100%}
  .cd-clock{gap:6px}
  .cd-unit{min-width:0;flex:1;padding:8px 4px}
  .cd-unit b{font-size:22px}

  .tt-row{
    grid-template-columns:58px 46px 1fr auto;
    gap:10px;
    padding:14px 8px;
  }

  .day{font-size:18px}
  .name{font-size:16px}
  .time{font-size:20px}
  .badge{margin-left:6px}
}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

<div class="mob-nav" id="mobNav">

<!-- ───────────── LANDING HERO ───────────── -->
<section class="hero" id="top">
  <div class="hero-bg" aria-hidden="true"></div>

  <div class="hero-content">

    <div class="hero-type">

      <h1>
        <span class="row">A Championship</span>
        <span class="row">Written in</span>
        <span class="row"><span class="dynamic" id="dyn">Precision</span></span>
      </h1>
    </div>

    <div class="hero-bottom">
      <a href="#race" class="next-link">
        <span>Next Race</span>
        <span class="next-line"></span>
      </a>
    </div>

  </div>
</section>

<!-- ───────────── NEXT RACE (rendered from the 2026 calendar data) ───────────── -->
<section class="race-section" id="race">
  <div class="race-inner">

    <div class="race-head">
      <div>
        <div class="eyebrow" id="rEyebrow">Loading calendar…</div>
        <div class="race-title" id="rTitle">Next <span>Grand Prix</span></div>
        <div class="race-sub" id="rSub"></div>
      </div>

      <div class="race-meta" id="rMeta"></div>
    </div>

    <div class="race-bar">
      <div class="cd" id="cd">
        <div class="cd-label" id="cdLabel">Lights out in</div>
        <div class="cd-clock" id="cdClock">
          <div class="cd-unit"><b id="cdD">00</b><span>days</span></div>
          <div class="cd-unit"><b id="cdH">00</b><span>hrs</span></div>
          <div class="cd-unit"><b id="cdM">00</b><span>min</span></div>
          <div class="cd-unit"><b id="cdS">00</b><span>sec</span></div>
        </div>
        <div class="cd-note" id="cdNote" hidden></div>
      </div>

      <div class="tzswitch" id="tzSwitch">
        <button type="button" data-tz="track" class="on">Track time</button>
        <button type="button" data-tz="local">Your time</button>
      </div>
    </div>

    <div class="timetable" id="timetable"></div>

    <div class="cal">
      <div class="cal-head">
        <span id="calTitle">2026 Season · 23 Rounds</span>
        <button type="button" class="cal-reset" id="calReset" hidden>← Back to next race</button>
      </div>
      <div class="cal-rail" id="calRail"></div>
    </div>

  </div>
</section>

<script>
/* ═══════════════════════════════════════════════════════════════
   2026 FIA FORMULA ONE WORLD CHAMPIONSHIP — CALENDAR DATA
   ───────────────────────────────────────────────────────────────
   Times below are LOCAL TRACK TIMES exactly as published, written
   as ['CODE','YYYY-MM-DD','HH:MM'].  The script converts them to
   real instants using each circuit's IANA time zone, so daylight
   saving is handled for you and nothing needs hard-coded offsets.

   To update the page you only ever touch this array — the heading,
   metadata, countdown, timetable and season rail all read from it.

   Revised 23-round calendar: the April Bahrain and Saudi Arabian
   rounds were cancelled, and the Bahrain Grand Prix was later
   reinstated at Sepang International Circuit (2–4 October).
   ═══════════════════════════════════════════════════════════════ */

      tz:'Australia/Melbourne', km:5.278, laps:58,

        ['RACE','2026-03-08','15:00']
      ]
    },
    {

        ['SPR','2026-03-14','11:00'],['QLF','2026-03-14','15:00'],
        ['RACE','2026-03-15','15:00']
      ]
    },
    {
      round:3, code:'JPN', title:'Japanese', circuit:'Suzuka International Racing Course', place:'Suzuka, Japan',
      tz:'Asia/Tokyo', km:5.807, laps:53,
      sessions:[
        ['FP1','2026-03-27','11:30'],['FP2','2026-03-27','15:00'],
        ['FP3','2026-03-28','11:30'],['QLF','2026-03-28','15:00'],
        ['RACE','2026-03-29','14:00']
      ]
    },
    {
      round:4, code:'MIA', title:'Miami', circuit:'Miami International Autodrome', place:'Miami, United States',
      tz:'America/New_York', km:5.412, laps:57, sprint:true,
      sessions:[
        ['FP1','2026-05-01','12:30'],['SQ','2026-05-01','16:30'],
        ['SPR','2026-05-02','12:00'],['QLF','2026-05-02','16:00'],
        ['RACE','2026-05-03','16:00']
      ]
    },
    {
      round:5, code:'CAN', title:'Canadian', circuit:'Circuit Gilles-Villeneuve', place:'Montréal, Canada',
      tz:'America/Toronto', km:4.361, laps:70, sprint:true,

/* ─── session catalogue: label + how long each session lasts ─── */
const SESSIONS = {
  FP1 :{label:'Free Practice One',   mins:60 },
  FP2 :{label:'Free Practice Two',   mins:60 },
  FP3 :{label:'Free Practice Three', mins:60 },
  SQ  :{label:'Sprint Qualifying',   mins:45 },
  SPR :{label:'Sprint',              mins:40 },
  QLF :{label:'Qualifying',          mins:60 },
  RACE:{label:'Grand Prix',          mins:135}
};

const ROUND_WORDS=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten',
  'Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen',
  'Nineteen','Twenty','Twenty-One','Twenty-Two','Twenty-Three','Twenty-Four'];

/* ═══════════ TIME ZONE MATHS ═══════════
   Turn a wall-clock time in a named zone into a real timestamp,
   without any hard-coded UTC offsets (DST-safe). */

function zoneOffset(ms,tz){
  const parts=new Intl.DateTimeFormat('en-US',{
    timeZone:tz,hourCycle:'h23',
    year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit',second:'2-digit'
  }).formatToParts(new Date(ms));

  const p={};
  parts.forEach(x=>{if(x.type!=='literal')p[x.type]=x.value});

  const asIfUTC=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second);
  return asIfUTC-ms;
}

function zonedToTimestamp(dateStr,timeStr,tz){
  const [y,m,d]=dateStr.split('-').map(Number);
  const [hh,mm]=timeStr.split(':').map(Number);
  const naive=Date.UTC(y,m-1,d,hh,mm);

  // two passes settle the offset even across a DST boundary
  let ts=naive-zoneOffset(naive,tz);
  ts=naive-zoneOffset(ts,tz);
  return ts;
}

/* ═══════════ BUILD THE EVENT MODEL ═══════════ */

const EVENTS=SEASON.rounds.map(r=>{
  const sessions=r.sessions.map(([code,date,time])=>{
    const meta=SESSIONS[code];
    const start=zonedToTimestamp(date,time,r.tz);
    return {
      code,
      label: code==='RACE' ? r.title+' Grand Prix' : meta.label,
      start,
      end: start+meta.mins*60000
    };
  }).sort((a,b)=>a.start-b.start);

  const race=sessions.find(s=>s.code==='RACE');

  return {...r, sessions, raceStart:race.start, weekendEnd:race.end};
});

const LOCAL_TZ=Intl.DateTimeFormat().resolvedOptions().timeZone;

/* ═══════════ THE CLOCK ═══════════
   Everything on the page is derived from nowMs() — the real system
   clock — which is why the section rolls onto the following round by
   itself as dates pass.  Nothing here is hard-coded to one race.

   For testing you can fast-forward the page with a query string, e.g.
     …/F1_landing_updated.html?now=2026-10-08T09:00Z
   and the whole section rebuilds as if that were the current moment. */

const CLOCK_SHIFT=(()=>{
  const q=new URLSearchParams(location.search).get('now');
  if(!q)return 0;
  const t=Date.parse(q);
  return isNaN(t)?0:t-Date.now();
})();

function nowMs(){
  return Date.now()+CLOCK_SHIFT;
}

/* ═══════════ VIEW STATE ═══════════ */

let tzMode='track';       // 'track' | 'local'
let viewIndex=null;       // null = follow the calendar automatically
let lastSignature='';

try{
  const saved=localStorage.getItem('f1-tz-mode');
  if(saved==='track'||saved==='local')tzMode=saved;
}catch(e){/* storage blocked — stay on track time */}

/* ═══════════ HELPERS ═══════════ */

const $=id=>document.getElementById(id);

function nextEventIndex(now){
  const i=EVENTS.findIndex(ev=>ev.weekendEnd>now);
  return i===-1?EVENTS.length-1:i;   // season finished → hold on the finale
}

function seasonOver(now){
  return now>EVENTS[EVENTS.length-1].weekendEnd;
}

function displayTz(ev){
  return tzMode==='track'?ev.tz:LOCAL_TZ;
}

function fmt(ts,tz,opts){
  return new Intl.DateTimeFormat('en-GB',{timeZone:tz,...opts}).format(new Date(ts));
}

function clockOf(ts,tz){
  return fmt(ts,tz,{hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
}

/* "FRI" + "03 OCT" style pieces, trimmed to three letters */
function dateBits(ts,tz){
  const g={};
  new Intl.DateTimeFormat('en-GB',{timeZone:tz,weekday:'short',day:'2-digit',month:'short'})
    .formatToParts(new Date(ts))
    .forEach(p=>{if(p.type!=='literal')g[p.type]=p.value});

  return {
    weekday:g.weekday.replace('.','').slice(0,3),
    day:g.day,
    month:g.month.replace('.','').slice(0,3).toUpperCase()
  };
}

function offsetLabel(ts,tz){
  const part=new Intl.DateTimeFormat('en-GB',{timeZone:tz,timeZoneName:'shortOffset'})
    .formatToParts(new Date(ts)).find(p=>p.type==='timeZoneName');
  return part?part.value.replace('GMT','UTC'):'';
}

function pad(n){return String(n).padStart(2,'0')}

/* ═══════════ RENDER ═══════════ */

function render(force){
  const now=nowMs();
  const autoIdx=nextEventIndex(now);
  const idx=viewIndex===null?autoIdx:viewIndex;
  const ev=EVENTS[idx];
  const tz=displayTz(ev);
  const over=seasonOver(now);

  const live=ev.sessions.find(s=>now>=s.start&&now<s.end);
  const upcoming=ev.sessions.find(s=>s.start>now);

  /* only rebuild the DOM when something structural changed */
  const signature=[idx,tzMode,live?live.code:'-',upcoming?upcoming.code:'-',over].join('|');

  if(force||signature!==lastSignature){
    lastSignature=signature;

    /* ── heading ── */
    const word='Round '+ROUND_WORDS[ev.round];
    let eyebrow;

    if(over&&idx===EVENTS.length-1)      eyebrow='Season Complete · '+word;
    else if(live)                        eyebrow='Live Now · '+word;
    else if(idx<autoIdx)                 eyebrow='Completed · '+word;
    else if(idx===autoIdx)               eyebrow='Next Race · '+word;
    else                                 eyebrow='Upcoming · '+word;

    $('rEyebrow').textContent=eyebrow;
    $('rTitle').innerHTML=ev.title+' <span>Grand Prix</span>';

    $('rSub').innerHTML=ev.place
      +(ev.sprint?' · <em>Sprint Weekend</em>':'')
      +(ev.note?'<br>'+ev.note:'');

    const race=ev.sessions.find(s=>s.code==='RACE');
    const rb=dateBits(race.start,tz);

    $('rMeta').innerHTML=
      ev.circuit+'<br>'
      +'<b>'+ev.km.toFixed(3)+' KM</b> · <b>'+ev.laps+' LAPS</b><br>'
      +rb.weekday+' '+rb.day+' '+rb.month+' · Race <b>'+clockOf(race.start,tz)+'</b><br>'
      +(tzMode==='track'?'Track time':'Your time')+' · '+offsetLabel(race.start,tz);

    /* ── timetable ── */
    $('timetable').innerHTML=ev.sessions.map(s=>{
      const isPast=now>=s.end;
      const isLive=live&&live.code===s.code;
      const isNext=!live&&upcoming&&upcoming.code===s.code;

      const cls=['tt-row'];
      if(s.code==='RACE')cls.push('race');
      if(isPast)cls.push('past');
      if(isLive)cls.push('live');
      else if(isNext)cls.push('on');

      const b=dateBits(s.start,tz);

      return '<div class="'+cls.join(' ')+'">'
        +'<div class="day">'+b.weekday
          +'<small>'+b.day+' '+b.month+'</small></div>'
        +'<div class="code">'+s.code+'</div>'
        +'<div class="name">'+s.label
          +(isLive?'<span class="badge"><i></i>Live</span>':'')
          +(isNext?'<span class="badge">Next Up</span>':'')+'</div>'
        +'<div class="time">'+clockOf(s.start,tz)+'</div>'
      +'</div>';
    }).join('');

    /* ── season rail ── */
    $('calRail').innerHTML=EVENTS.map((e,i)=>{
      const done=e.weekendEnd<now;
      const cls=['chip'];
      if(done)cls.push('done');
      if(i===autoIdx&&!over)cls.push('next');
      if(i===idx)cls.push('viewing');

      const railTz=tzMode==='track'?e.tz:LOCAL_TZ;
      const rbits=dateBits(e.raceStart,railTz);

      return '<button type="button" class="'+cls.join(' ')+'" data-round="'+i+'">'
        +'<span class="r">R'+pad(e.round)+'</span>'
        +'<span class="c">'+e.code+'</span>'
        +'<span class="d">'+rbits.day+' '+rbits.month+'</span>'
        +(e.sprint?'<span class="s">SPR</span>':'')
      +'</button>';
    }).join('');

    $('calTitle').textContent=SEASON.year+' Season · '+EVENTS.length+' Rounds';
    $('calReset').hidden=(viewIndex===null);

    if(viewIndex===null){
      const chip=$('calRail').querySelector('.chip.next')||$('calRail').querySelector('.chip.viewing');
      if(chip)chip.scrollIntoView({block:'nearest',inline:'center'});
    }
  }

  /* ── countdown (ticks every second) ── */
  const cd=$('cd');

  if(live){
    $('cdClock').hidden=true;
    $('cdNote').hidden=false;
    $('cdNote').textContent=live.label+' — under way';
    $('cdLabel').innerHTML='Running now';
    cd.classList.add('hot');
  }else if(upcoming){
    let diff=Math.max(0,upcoming.start-now);
    const d=Math.floor(diff/86400000); diff-=d*86400000;
    const h=Math.floor(diff/3600000);  diff-=h*3600000;
    const m=Math.floor(diff/60000);    diff-=m*60000;
    const s=Math.floor(diff/1000);

    $('cdClock').hidden=false;
    $('cdNote').hidden=true;
    $('cdD').textContent=pad(d);
    $('cdH').textContent=pad(h);
    $('cdM').textContent=pad(m);
    $('cdS').textContent=pad(s);

    $('cdLabel').innerHTML=upcoming.code==='RACE'
      ? 'Lights out in'
      : '<b>'+upcoming.label+'</b> starts in';

    cd.classList.toggle('hot',upcoming.start-now<3600000);
  }else{
    $('cdClock').hidden=true;
    $('cdNote').hidden=false;
    $('cdNote').textContent=over&&idx===EVENTS.length-1?'Season complete':'Race weekend complete';
    $('cdLabel').textContent=ev.title+' Grand Prix';
    cd.classList.remove('hot');
  }
}

/* ═══════════ INTERACTION ═══════════ */

$('tzSwitch').addEventListener('click',e=>{
  const btn=e.target.closest('button[data-tz]');
  if(!btn)return;

  tzMode=btn.dataset.tz;
  try{localStorage.setItem('f1-tz-mode',tzMode)}catch(err){}

  $('tzSwitch').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===btn));
  render(true);
});

$('calRail').addEventListener('click',e=>{
  const chip=e.target.closest('.chip');
  if(!chip)return;

  const i=+chip.dataset.round;
  viewIndex=(i===nextEventIndex(nowMs()))?null:i;
  render(true);
  document.getElementById('race').scrollIntoView({behavior:'smooth',block:'start'});
});

$('calReset').addEventListener('click',()=>{
  viewIndex=null;
  render(true);
});

/* restore saved timezone choice on the toggle, then go */
$('tzSwitch').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.tz===tzMode));
render(true);
setInterval(()=>render(false),1000);

/* ═══════════ HERO: dynamic word ═══════════ */

const words=['Precision','Speed','Power','Strategy'];
let wordIndex=0;
let charIndex=0;
let deleting=false;
const dyn=document.getElementById('dyn');

function typeLoop(){
  const word=words[wordIndex];

  if(!deleting){
    dyn.textContent=word.slice(0,charIndex+1);
    charIndex++;

    if(charIndex===word.length){
      deleting=true;
      setTimeout(typeLoop,1800);
      return;
    }
  }else{
    dyn.textContent=word.slice(0,charIndex-1);
    charIndex--;

    if(charIndex===0){
      deleting=false;
      wordIndex=(wordIndex+1)%words.length;
    }
  }

  setTimeout(typeLoop,deleting?55:95);
}

setTimeout(typeLoop,1200);

/* ═══════════ F1-style start sequence ═══════════
   5 red lights come on one-by-one, then all go out together
   after a short randomized hold — like a race start. */

const bulbs=[1,2,3,4,5].map(i=>document.getElementById('lb'+i));

function raceStartSequence(){
  // Make sure the gantry starts completely dark.
  bulbs.forEach(bulb=>bulb.classList.remove('lit'));

  // Illuminate one red light at a time.
  bulbs.forEach((bulb,index)=>{
    setTimeout(()=>{
      bulb.classList.add('lit');
    }, index * 900);
  });

  // After the fifth light, hold briefly, then lights-out.
  const lightsOutDelay = 900 * 4 + 1000 + Math.random() * 2200;

  setTimeout(()=>{
    bulbs.forEach(bulb=>bulb.classList.remove('lit'));
  }, lightsOutDelay);

  // Reset and prepare another demonstration sequence.
  setTimeout(()=>{
    bulbs.forEach(bulb=>bulb.classList.remove('lit'));
    raceStartSequence();
  }, lightsOutDelay + 7000);
}

setTimeout(raceStartSequence,1600);
