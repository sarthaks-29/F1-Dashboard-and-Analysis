<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Austrian Grand Prix</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#f5f5f5;
    font-family:Arial, Helvetica, sans-serif;
    padding:50px 70px;
}

/* Header */
.header{
    margin-bottom:35px;
}

.header h1{
    font-size:48px;
    font-weight:700;
    margin-bottom:8px;
}

.header h2{
    font-size:26px;
    font-weight:500;
    color:#d0d0d0;
    margin-bottom:5px;
}

.header p{
    font-size:18px;
    color:#9e9e9e;
}

/* Divider */
.line{
    width:100%;
    height:1px;
    background:#3d3d3d;
    margin-bottom:40px;
}

/* Main Layout */
.content{
    display:flex;
    align-items:flex-start;
}

/* Left */
.left{
    width:48%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding-right:50px;
}

.left img{
    width:120%;
    max-width:700px;   /* Increase this if needed */
    height:auto;
    object-fit:contain;
}

/* Vertical Divider */
.separator1{
    width:1px;
    background:#444;
    align-self:stretch;
}

/* Right */
.center{
    width:55%;
    padding-left:70px;
}

.info{
    display:grid;
    grid-template-columns:180px auto;
    row-gap:18px;
}

.label{
    color:#9a9a9a;
    font-size:18px;
}

.value{
    color:#fff;
    font-size:18px;
    font-weight:500;
}
.separator2{
    width:1px;
    background:#444;
    align-self:stretch;
}
</style>
</head>

<body>

<div class="header">
    <h1>Austrian Grand Prix</h1>
    <h2>Red Bull Ring</h2>
    <p>Spielberg, Austria</p>
</div>

<div class="line"></div>

<div class="content">

    <div class="left">
        <img src="RedBullRing.avif" alt="Red Bull Ring">
    </div>

    <div class="separator"></div>

    <div class="right">

        <div class="info">

            <div class="label">Length</div>
            <div class="value">4.318 km</div>

            <div class="label">Turns</div>
            <div class="value">10</div>

            <div class="label">Laps</div>
            <div class="value">71</div>

            <div class="label">Race Distance</div>
            <div class="value">306.452 km</div>

            <div class="label">First Grand Prix</div>
            <div class="value">1970</div>

            <div class="label">Lap Record</div>
            <div class="value">1:05.619</div>

            <div class="label">DRS Zones</div>
            <div class="value">3</div>

            <div class="label">Corners</div>
            <div class="value">3 Left • 7 Right</div>

        </div>

    </div>

</div>

</body>
</html>
