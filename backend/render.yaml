services:
  - type: web
    name: f1-dashboard-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CHAMPIONSHIP_API_URL
        sync: false
    healthCheckPath: /
